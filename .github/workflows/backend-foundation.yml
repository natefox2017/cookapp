name: Backend foundation check

on:
  push:
    paths:
      - "supabase/**"
      - "docs/backend/**"
      - ".github/workflows/backend-foundation.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "docs/backend/**"
      - ".github/workflows/backend-foundation.yml"

jobs:
  schema-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Required backend files exist
        run: |
          set -euo pipefail
          test -f supabase/config.toml
          test -f supabase/openapi/openapi.yaml
          test -f docs/backend/README.md
          test -d supabase/migrations
          test -f supabase/functions/delete-account/index.ts
          test -f supabase/functions/revenuecat-webhook/index.ts
          test -f supabase/functions/health/index.ts
          test -f supabase/functions/openapi/index.ts
          test -f supabase/functions/_shared/auth.ts
          test -f supabase/functions/admin-recipe-import/index.ts
          test -f supabase/functions/_shared/ai-router.ts
          test -f supabase/functions/_shared/media-storage.ts
          test -f supabase/functions/_shared/recipe-import/pipeline.ts
          echo "Backend foundation paths OK"
      - name: OpenAPI YAML parses
        run: |
          python3 - <<'PY'
          import pathlib, sys
          try:
              import yaml
          except ImportError:
              import subprocess
              subprocess.check_call([sys.executable, "-m", "pip", "install", "pyyaml", "-q"])
              import yaml
          raw = pathlib.Path("supabase/openapi/openapi.yaml").read_text()
          data = yaml.safe_load(raw)
          assert data.get("openapi", "").startswith("3."), data.get("openapi")
          assert "paths" in data and len(data["paths"]) > 0
          print("OpenAPI OK:", data["info"]["title"], "paths=", len(data["paths"]))
          PY
      - name: OpenAPI representations match
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          try:
              import yaml
          except ImportError:
              import subprocess
              subprocess.check_call([sys.executable, "-m", "pip", "install", "pyyaml", "-q"])
              import yaml

          source = yaml.safe_load(
              pathlib.Path("supabase/openapi/openapi.yaml").read_text()
          )

          for name in (
              "supabase/openapi/openapi.json",
              "supabase/functions/openapi/spec.json",
          ):
              actual = json.loads(pathlib.Path(name).read_text())
              assert actual == source, f"{name} is out of date"

          text = pathlib.Path("supabase/functions/openapi/index.ts").read_text()
          assert 'from "./spec.json"' in text or "from './spec.json'" in text, (
              "openapi Edge Function must import ./spec.json"
          )
          print("OpenAPI representations match")
          PY
      - name: Migration filenames are ordered SQL
        run: |
          set -euo pipefail
          count=$(ls supabase/migrations/*.sql | wc -l)
          test "$count" -ge 2
          echo "migrations=$count"
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Log redaction + request id tests
        run: |
          set -euo pipefail
          deno test --allow-env supabase/functions/_shared/logger_test.ts
      - name: Media storage unit tests
        run: |
          set -euo pipefail
          deno test --allow-env supabase/functions/_shared/media-storage/
      - name: Recipe import pipeline unit tests
        run: |
          set -euo pipefail
          deno test --allow-env supabase/functions/_shared/recipe-import/
