name: ios-foundation
on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-foundation.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"

jobs:
  placeholder:
    name: iOS scaffold check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify iOS tree
        run: |
          test -f ios/project.yml
          test -f ios/CookApp/App/CookAppApp.swift
          test -f ios/CookApp/Core/Theme/DesignTokens.swift
          test -f ios/CookApp/Features/Auth/AuthService.swift
          test -f ios/CookApp/Features/Subscription/SubscriptionService.swift
          echo "iOS foundation paths OK (Xcode build reserved for macOS runners)."
      - name: Phase 1.5 navigation skeleton checks
        run: python3 ios/Scripts/verify_navigation_skeleton.py
