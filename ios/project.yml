# XcodeGen project definition for CookApp.
# Generate with: brew install xcodegen && cd ios && xcodegen generate

name: CookApp
options:
  bundleIdPrefix: com.natefox
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.0.0
targets:
  CookApp:
    type: application
    platform: iOS
    sources:
      - path: CookApp
    resources:
      - path: CookApp/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.natefox.cookapp
        PRODUCT_NAME: CookApp
        INFOPLIST_FILE: CookApp/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    dependencies:
      - package: Supabase
        product: Supabase
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI
    entitlements:
      path: CookApp/Resources/CookApp.entitlements
  CookAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CookAppTests
    dependencies:
      - target: CookApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.natefox.cookapp.tests
        GENERATE_INFOPLIST_FILE: true
schemes:
  CookApp:
    build:
      targets:
        CookApp: all
        CookAppTests: [test]
    test:
      targets:
        - CookAppTests
    run:
      config: Debug
