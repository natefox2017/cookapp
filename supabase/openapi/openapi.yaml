  /functions/v1/recipe-import-worker:
    post:
      tags:
      - Operations
      - AdminRecipeImport
      summary: Process recipe import queue (pgmq worker tick)
      description: |
        Operational job type `recipe_import_worker` (Issue #56).
        Reads up to `import_queue_concurrency` messages from Supabase Queues (pgmq),
        calls shared `runImportPipeline`, archives on success / poison.
        Server/cron only — auth via `Authorization: Bearer <RECIPE_IMPORT_WORKER_SECRET>`.
        Concurrency / VT / max attempts come from `runtime_config` (not secrets).
      operationId: recipeImportWorkerTick
      security:
      - WorkerBearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                recoverStale:
                  type: boolean
                  default: true
                  description: Re-enqueue pending jobs older than 60s
      responses:
        '200':
          description: Worker tick result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  job_type:
                    type: string
                  claimed:
                    type: integer
                  processed:
                    type: integer
                  succeeded:
                    type: integer
                  failed:
                    type: integer
                  poisoned:
                    type: integer
                  skipped:
                    type: integer
                  recovered:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/XJobId'
  /functions/v1/revenuecat-webhook:
    post:
      tags:
      - Subscription
      summary: RevenueCat webhook
      description: |
        Server-to-server. Auth via `Authorization: Bearer <REVENUECAT_WEBHOOK_SECRET>`.
        JWT verification disabled; service role used internally.
      security:
      - WebhookBearer: []
      responses:
        '200':
          description: Event received
      parameters:
      - $ref: '#/components/parameters/XJobId'
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XRequestId'
  /functions/v1/storage-cleanup-import-artifacts:
    post:
      tags:
      - Storage
      - Operations
      summary: Cleanup expired recipe-import-artifacts
      description: |
        Operational job type `storage_cleanup_import_artifacts`.
        Deletes Storage objects whose `recipe_import_artifact_objects.expires_at`
        has passed and marks rows deleted. Server/cron only — auth via
        `Authorization: Bearer <STORAGE_CLEANUP_SECRET>`.
        Never uses permanent signed URLs; never returns service_role secrets.
      operationId: storageCleanupImportArtifacts
      security:
      - CleanupBearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  default: 200
      responses:
        '200':
          description: Cleanup run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageCleanupResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Misconfigured (missing STORAGE_CLEANUP_SECRET)
  /functions/v1/store-sync-worker:
    post:
      tags:
      - Operations
      - AdminStoreSync
      summary: Cron worker tick for Apple store sync
      description: |
        Server/cron only. Auth via `Authorization: Bearer <STORE_SYNC_WORKER_SECRET>`.
        Syncs Apple analytics + financial only. Never auto-syncs Google Play.
      security:
      - StoreSyncWorkerBearer: []
      operationId: storeSyncWorkerTick
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XJobId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                analytics:
                  type: boolean
                  default: true
                financial:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Worker tick completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  job_type:
                    type: string
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/StoreSyncRunResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Misconfigured (missing STORE_SYNC_WORKER_SECRET)
