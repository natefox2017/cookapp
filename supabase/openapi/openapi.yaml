components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token
    WebhookBearer:
      type: http
      scheme: bearer
      description: REVENUECAT_WEBHOOK_SECRET
    Apikey:
      type: apiKey
      in: header
      name: apikey
      description: Supabase anon key (required alongside JWT for PostgREST)
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Admin Dashboard session token from admin-auth/login (not end-user JWT)
    CleanupBearer:
      type: http
      scheme: bearer
      description: STORAGE_CLEANUP_SECRET (cron / operations worker only)
    WorkerBearer:
      type: http
      scheme: bearer
      description: RECIPE_IMPORT_WORKER_SECRET (cron / import queue worker only)
    StoreSyncWorkerBearer:
      type: http
      scheme: bearer
      description: STORE_SYNC_WORKER_SECRET (cron / App Store sync worker only; Issue
  parameters:
    PreferReturn:
      name: Prefer
      in: header
      schema:
        type: string
        example: return=representation
    RecipeImportJobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: |
        Client-supplied request id. When omitted, the server generates a UUID.
        Echoed on every Admin / webhook response and included in structured logs
        and `admin_audit_logs.request_id`.
      schema:
        type: string
        maxLength: 128
    XCorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: |
        Cross-service correlation id. Defaults to `X-Request-Id` when omitted.
      schema:
        type: string
        maxLength: 128
    XJobId:
      name: X-Job-Id
      in: header
      required: false
      description: |
        Optional async job / sync run id (import jobs, provider syncs, webhook
        event id). Stored on audit rows and structured logs when present.
      schema:
        type: string
        maxLength: 128
  responses:
    Unauthorized:
      description: Missing or invalid session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    ErrorEnvelope:
      description: |
        Unified Edge Function error body. Always includes `request_id` (may be
        null only on legacy paths that predate Issue #57). Secrets are never
        returned in `details`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorBody:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
    AdminIdentity:
      type: object
      required:
      - id
      - username
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          enum:
          - owner
          - admin
          - operator
          - readonly
        mustChangePassword:
          type: boolean
    AdminSessionPayload:
      type: object
      required:
      - token
      - expiresAt
      - admin
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
        admin:
          $ref: '#/components/schemas/AdminIdentity'
    AdminAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          description: 'Present after #51 hardening migration'
    AdminLoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    AdminLoginResponse:
      type: object
      required:
      - token
      - expiresAt
      - admin
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
        admin:
          $ref: '#/components/schemas/AdminAccount'
    AdminChangePasswordRequest:
      type: object
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
    AdminUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        status:
          type: string
          enum:
          - active
          - suspended
          - deleted
        subscription:
          type: string
          enum:
          - free
          - pro
          - lifetime
        registrationProvider:
          type: string
          enum:
          - apple
          - google
          - email
          - unknown
        deviceType:
          type: string
          enum:
          - ios
          - android
          - web
          - unknown
        createdAt:
          type: string
          format: date-time
        favoriteCount:
          type: integer
    AdminUserDetail:
      allOf:
      - $ref: '#/components/schemas/AdminUser'
      - type: object
        properties:
          registrationIp:
            type:
            - string
            - 'null'
          commerceSummary:
            $ref: '#/components/schemas/UserCommerceSummary'
          payments:
            type: array
            description: Timeline from payment_transactions (not ad-hoc purchase_events totals)
            items:
              $ref: '#/components/schemas/UserPaymentRecord'
    UserCommerceSummary:
      type: object
      description: Derived aggregates from view user_commerce_summary only (#58)
      properties:
        subscriptionPlan:
          type:
          - string
          - 'null'
        subscriptionStatus:
          type:
          - string
          - 'null'
        subscriptionExpiresAt:
          type:
          - string
          - 'null'
          format: date-time
        firstPurchaseAt:
          type:
          - string
          - 'null'
          format: date-time
        lastPurchaseAt:
          type:
          - string
          - 'null'
          format: date-time
        purchaseCount:
          type: integer
        refundCount:
          type: integer
        grossSpend:
          type: number
        refundedAmount:
          type: number
        netSpend:
          type: number
        estimatedLtvUsd:
          type: number
        primaryCurrency:
          type:
          - string
          - 'null'
        storeTerritory:
          type:
          - string
          - 'null'
        source:
          type: string
          enum:
          - user_commerce_summary
    UserPaymentRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
        productId:
          type:
          - string
          - 'null'
        store:
          type:
          - string
          - 'null'
          enum:
          - app_store
          - google_play
          - play_store
          - null
        amount:
          type:
          - number
          - 'null'
        currency:
          type:
