  /functions/v1/admin-store-sync/analytics/daily:
    get:
      tags:
      - AdminStoreSync
      summary: Query store_analytics_daily
      description: |
        Normalized App Store analytics. `metricValue` may be null when Apple
        omitted data (privacy threshold). Clients must not coerce null to 0.
        Not final financial truth — use financial/rows for proceeds.
      security:
      - AdminBearer: []
      operationId: adminStoreAnalyticsDaily
      parameters:
      - name: start
        in: query
        schema:
          type: string
          format: date
      - name: end
        in: query
        schema:
          type: string
          format: date
      - name: platform
        in: query
        schema:
          type: string
          enum:
          - ios
          - android
      - name: store
        in: query
        schema:
          type: string
          enum:
          - app_store
          - google_play
      - name: limit
        in: query
        schema:
          type: integer
          default: 500
      responses:
        '200':
          description: Analytics daily rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreAnalyticsDailyResponse'
  /functions/v1/admin-store-sync/analytics/sync:
    post:
      tags:
      - AdminStoreSync
      summary: Trigger store analytics sync (Owner)
      description: |
        Runs `StoreAnalyticsProvider` for the given provider and records a
        `store_sync_runs` row. Missing ASC credentials → `skipped_not_configured`
        with zero invented series. Google Play → `skipped_reserved`.
      security:
      - AdminBearer: []
      operationId: adminStoreAnalyticsSync
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreSyncRequest'
      responses:
        '200':
          description: Sync run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSyncRunResult'
        '403':
          description: Owner role required
  /functions/v1/admin-store-sync/financial/rows:
    get:
      tags:
      - AdminStoreSync
      summary: Query financial_report_rows
      description: |
        Apple Financial Reports reconciliation rows. Kept separate from analytics —
        never merge into one "final revenue" field with analytics estimates.
      security:
      - AdminBearer: []
      operationId: adminFinancialReportRows
      parameters:
      - name: fiscalPeriod
        in: query
        schema:
          type: string
          description: Apple fiscal month YYYY-MM
      - name: store
        in: query
        schema:
          type: string
          enum:
          - app_store
          - google_play
      - name: limit
        in: query
        schema:
          type: integer
          default: 500
      responses:
        '200':
          description: Financial report rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialReportRowsResponse'
  /functions/v1/admin-store-sync/financial/sync:
    post:
      tags:
      - AdminStoreSync
      summary: Trigger financial report sync (Owner)
      description: |
        Runs `FinancialReportProvider` and upserts `financial_report_rows`.
        Separate from analytics sync — never writes analytics metrics as proceeds.
      security:
      - AdminBearer: []
      operationId: adminFinancialReportSync
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreSyncRequest'
      responses:
        '200':
          description: Sync run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSyncRunResult'
        '403':
          description: Owner role required
  /functions/v1/admin-store-sync/integrations/apple_app_store/credentials:
    put:
      tags:
      - AdminStoreSync
      summary: Set App Store Connect credentials (Owner, write-only)
      description: |
        Stores ASC private key ciphertext in `store_secrets`. Never returns plaintext.
        Non-secret fields (issuerId, keyId, vendorNumber, appAppleId) stored on
        `store_integrations`. Env fallbacks documented in OWNER_CONFIG.
      security:
      - AdminBearer: []
      operationId: adminStoreSetAppleCredentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleStoreCredentialsWrite'
      responses:
        '200':
          description: Credentials stored (status only)
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider:
                    type: string
                    enum:
                    - apple_app_store
                  status:
                    type: string
                  secretConfigured:
                    type: boolean
        '403':
          description: Owner role required
  /functions/v1/admin-store-sync/runs:
