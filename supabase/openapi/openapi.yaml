openapi: 3.1.0
info:
  title: CookApp Cloud Backend API
  version: 1.0.0
  description: 'Supabase-backed API for CookApp. Primary data access is PostgREST (`/rest/v1`)

    with Row Level Security. Privileged operations use Edge Functions (`/functions/v1`).


    Authentication: Supabase Auth session JWT (`Authorization: Bearer <access_token>`).

    Third-party OAuth tokens are never stored server-side.


    Project: `semsjyrqjnumpvanibip` · Base: `https://semsjyrqjnumpvanibip.supabase.co`

    '
  contact:
    name: CookApp
servers:
- url: https://semsjyrqjnumpvanibip.supabase.co
  description: Supabase Cloud
tags:
- name: Auth
- name: User
- name: Recipe
- name: Collection
- name: Ingredient
- name: Grocery
- name: MealPlan
- name: Pantry
- name: Category
- name: Storage
- name: Subscription
- name: System
- name: AdminAuth
- name: AdminUsers
- name: AdminDashboard
- name: AdminSubscriptions
- name: AdminRecipeImport
- name: Operations
paths:
  /auth/v1/token:
    post:
      tags:
      - Auth
      summary: Session token exchange / refresh
      description: 'Supabase Auth endpoint. Clients use the Supabase SDK for Apple ID token,

        Google OAuth, logout, and refresh. Documented for completeness.

        '
      security: []
      responses:
        '200':
          description: Session issued
  /functions/v1/delete-account:
    post:
      tags:
      - Auth
      - User
      summary: Delete account
      description: Purges user storage objects and deletes the auth user (cascades all owned rows).
      operationId: deleteAccount
      responses:
        '200':
          description: Account deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
  /functions/v1/revenuecat-webhook:
    post:
      tags:
      - Subscription
      summary: RevenueCat webhook
      description: 'Server-to-server. Auth via `Authorization: Bearer <REVENUECAT_WEBHOOK_SECRET>`.

        JWT verification disabled; service role used internally.

        '
      security:
      - WebhookBearer: []
      responses:
        '200':
          description: Event received
  /functions/v1/health:
    get:
      tags:
      - System
      summary: Backend health / module probe
      responses:
        '200':
          description: Healthy
  /functions/v1/admin-auth/login:
    post:
      tags:
      - AdminAuth
      summary: Admin login
      description: 'Issues a custom admin bearer session (not end-user JWT).

        Production rejects default `admin`/`admin` credentials (Issue #51).

        Set `COOKAPP_ADMIN_ALLOW_DEFAULT_CREDENTIALS=true` or `COOKAPP_ADMIN_ENV=development`

        only for local/dev.

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - password
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionPayload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Default credentials blocked in production
  /functions/v1/admin-auth/bootstrap:
    post:
      tags:
      - AdminAuth
      summary: Bootstrap Owner credentials
      description: 'Replaces the default seed account with a strong Owner password.

        Requires current default password when a seed row exists.

        Production requires header `X-CookApp-Bootstrap-Token` matching

        secret `COOKAPP_ADMIN_BOOTSTRAP_TOKEN` (never commit the token).

        Local/dev may omit the token when `COOKAPP_ADMIN_ENV=development`.

        '
      security: []
      parameters:
      - name: X-CookApp-Bootstrap-Token
        in: header
        required: false
        schema:
          type: string
        description: Required in production; equals COOKAPP_ADMIN_BOOTSTRAP_TOKEN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - newPassword
              properties:
                username:
                  type: string
                  default: admin
                newPassword:
                  type: string
                  format: password
                  minLength: 12
                currentPassword:
                  type: string
                  format: password
      responses:
        '200':
          description: Owner bootstrapped and session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionPayload'
        '400':
          description: Weak password or invalid bootstrap state
        '401':
          description: Current default password incorrect
        '409':
          description: Bootstrap not available
  /functions/v1/admin-auth/logout:
    post:
      tags:
      - AdminAuth
      summary: Admin logout
      description: Revokes the current admin bearer session.
      security:
      - AdminBearer: []
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
  /functions/v1/admin-auth/session:
    get:
      tags:
      - AdminAuth
      summary: Current admin session
      security:
      - AdminBearer: []
      responses:
        '200':
          description: Session valid
          content:
            application/json:
              schema:
                type: object
                required:
                - admin
                properties:
                  admin:
                    $ref: '#/components/schemas/AdminIdentity'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /functions/v1/admin-auth/change-password:
    post:
      tags:
      - AdminAuth
      summary: Change admin password
      description: 'Requires strong password policy (min 12, upper, lower, digit).

        Revokes all sessions for the account and returns a fresh token.

        '
      security:
      - AdminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - currentPassword
              - newPassword
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
                  minLength: 12
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AdminSessionPayload'
                - type: object
                  properties:
                    ok:
                      type: boolean
        '400':
          description: Weak password
        '401':
          $ref: '#/components/responses/Unauthorized'
  /rest/v1/profiles:
    get:
      tags:
      - User
      summary: GET User Profile
      operationId: getUserProfile
      parameters:
      - $ref: '#/components/parameters/PreferReturn'
      - name: id
        in: query
        schema:
          type: string
          format: uuid
        description: Filter `eq.<user_id>` (own id only under RLS)
      responses:
        '200':
          description: Profile rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserProfile'
    patch:
      tags:
      - User
      summary: UPDATE User Profile
      operationId: updateUserProfile
      parameters:
      - $ref: '#/components/parameters/PreferReturn'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserProfile'
  /rest/v1/recipes:
    get:
      tags:
      - Recipe
      summary: Recipe List / Detail
      description: 'List own recipes. For detail use `id=eq.<uuid>` (maps to GET /recipes/:id).

        Update: `PATCH` with `id=eq.<uuid>` (PUT /recipes/:id).

        Delete: `DELETE` with `id=eq.<uuid>` (DELETE /recipes/:id).

        '
      operationId: listRecipes
      parameters:
      - name: id
        in: query
        description: Filter e.g. `eq.<uuid>` for single recipe
        schema:
          type: string
      - name: order
        in: query
        schema:
          type: string
          example: created_at.desc
      - name: select
        in: query
        schema:
          type: string
          example: '*'
      responses:
        '200':
          description: Own recipes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recipe'
    post:
      tags:
      - Recipe
      summary: Create Recipe
      operationId: createRecipe
      parameters:
      - $ref: '#/components/parameters/PreferReturn'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeCreate'
      responses:
        '201':
          description: Created
    patch:
      tags:
      - Recipe
      summary: Update Recipe
      operationId: updateRecipe
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
          example: eq.<uuid>
      - $ref: '#/components/parameters/PreferReturn'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeCreate'
      responses:
        '200':
          description: Updated
    delete:
      tags:
      - Recipe
      summary: Delete Recipe
      operationId: deleteRecipe
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
          example: eq.<uuid>
      responses:
        '204':
          description: Deleted
  /rest/v1/collections:
    get:
      tags:
      - Collection
      summary: GET Collections
      operationId: listCollections
      responses:
        '200':
          description: Own collections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Collection'
    post:
      tags:
      - Collection
      summary: POST Collection
      operationId: createCollection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionCreate'
      responses:
        '201':
          description: Created
    patch:
      tags:
      - Collection
      summary: UPDATE Collection
      operationId: updateCollection
      responses:
        '200':
          description: Updated
    delete:
      tags:
      - Collection
      summary: DELETE Collection
      operationId: deleteCollection
      responses:
        '204':
          description: Deleted
  /rest/v1/collection_recipes:
    get:
      tags:
      - Collection
      summary: List recipes in collections
      responses:
        '200':
          description: Membership rows
    post:
      tags:
      - Collection
      summary: Add recipe to collection
      responses:
        '201':
          description: Added
    delete:
      tags:
      - Collection
      summary: Remove recipe from collection
      responses:
        '204':
          description: Removed
  /rest/v1/ingredients:
    get:
      tags:
      - Ingredient
      summary: List ingredients (system + own)
      responses:
        '200':
          description: Ingredient catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ingredient'
    post:
      tags:
      - Ingredient
      summary: Create user ingredient
      responses:
        '201':
          description: Created
    patch:
      tags:
      - Ingredient
      summary: Update own user ingredient
      responses:
        '200':
          description: Updated
    delete:
      tags:
      - Ingredient
      summary: Delete own user ingredient
      responses:
        '204':
          description: Deleted
  /rest/v1/grocery_lists:
    get:
      tags:
      - Grocery
      summary: GET Grocery Lists
      responses:
        '200':
          description: Lists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroceryList'
    post:
      tags:
      - Grocery
      summary: Create grocery list
      responses:
        '201':
          description: Created
    patch:
      tags:
      - Grocery
      summary: UPDATE Grocery List
      responses:
        '200':
          description: Updated
    delete:
      tags:
      - Grocery
      summary: DELETE Grocery List
      responses:
        '204':
          description: Deleted
  /rest/v1/grocery_items:
    get:
      tags:
      - Grocery
      summary: List grocery items
      responses:
        '200':
          description: Items
    post:
      tags:
      - Grocery
      summary: POST Item
      responses:
        '201':
          description: Created
    patch:
      tags:
      - Grocery
      summary: UPDATE Item
      responses:
        '200':
          description: Updated
    delete:
      tags:
      - Grocery
      summary: DELETE Item
      responses:
        '204':
          description: Deleted
  /rest/v1/meal_plans:
    get:
      tags:
      - MealPlan
      summary: List meal plans
      responses:
        '200':
          description: Meal plan entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MealPlan'
    post:
      tags:
      - MealPlan
      summary: Create meal plan entry
      responses:
        '201':
          description: Created
    patch:
      tags:
      - MealPlan
      summary: Update meal plan entry
      responses:
        '200':
          description: Updated
    delete:
      tags:
      - MealPlan
      summary: Delete meal plan entry
      responses:
        '204':
          description: Deleted
  /rest/v1/pantry_items:
    get:
      tags:
      - Pantry
      summary: List pantry items
      responses:
        '200':
          description: Pantry
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PantryItem'
    post:
      tags:
      - Pantry
      summary: Create pantry item
      responses:
        '201':
          description: Created
    patch:
      tags:
      - Pantry
      summary: Update pantry item
      responses:
        '200':
          description: Updated
    delete:
      tags:
      - Pantry
      summary: Delete pantry item
      responses:
        '204':
          description: Deleted
  /rest/v1/cuisines:
    get:
      tags:
      - Category
      summary: List cuisines
      responses:
        '200':
          description: Cuisine catalog
  /rest/v1/meal_categories:
    get:
      tags:
      - Category
      summary: List meal categories
      responses:
        '200':
          description: Meal category catalog
  /rest/v1/tags:
    get:
      tags:
      - Category
      summary: List tags
      responses:
        '200':
          description: Tag catalog
  /rest/v1/subscriptions:
    get:
      tags:
      - Subscription
      summary: Get own subscription row
      description: Table row uses `expires_at`. Prefer `/rest/v1/subscription_status` for spec-shaped
        `expire_date`.
      responses:
        '200':
          description: Subscription entitlement
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionRow'
  /rest/v1/subscription_status:
    get:
      tags:
      - Subscription
      summary: Get subscription status (plan / status / expire_date)
      responses:
        '200':
          description: Simplified subscription view matching Subscription Service contract
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionStatus'
  /storage/v1/object/{bucket}/{user_id}/{object}:
    parameters:
    - name: bucket
      in: path
      required: true
      schema:
        type: string
        enum:
        - avatars
        - recipe-covers
        - recipe-images
    - name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: object
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - Storage
      summary: Upload object (private bucket, path must start with auth user id)
      responses:
        '200':
          description: Uploaded
    get:
      tags:
      - Storage
      summary: Download / signed access to own object
      responses:
        '200':
          description: Object bytes
    delete:
      tags:
      - Storage
      summary: Delete own object
      responses:
        '200':
          description: Deleted
  /functions/v1/admin-users:
    get:
      tags:
      - AdminUsers
      summary: List users (paginated, filterable)
      operationId: adminListUsers
      security:
      - AdminBearer: []
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
      - name: subscription
        in: query
        schema:
          type: string
      - name: registrationProvider
        in: query
        schema:
          type: string
      - name: deviceType
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
      - name: pageSize
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUsers'
  /functions/v1/admin-users/stats:
    get:
      tags:
      - AdminUsers
      summary: Registration mix stats
      operationId: adminUserStats
      security:
      - AdminBearer: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegistrationStats'
  /functions/v1/admin-users/{id}:
    get:
      tags:
      - AdminUsers
      summary: User detail + payment timeline
      operationId: adminGetUser
      security:
      - AdminBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDetail'
  /functions/v1/admin-dashboard:
    get:
      tags:
      - AdminDashboard
      summary: Dashboard KPI aggregation
      operationId: adminDashboard
      security:
      - AdminBearer: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardData'
  /functions/v1/admin-subscriptions/plans:
    get:
      tags:
      - AdminSubscriptions
      summary: List subscription plan products
      operationId: adminListPlans
      security:
      - AdminBearer: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionPlanProduct'
    post:
      tags:
      - AdminSubscriptions
      summary: Create subscription plan product
      operationId: adminCreatePlan
      security:
      - AdminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionPlanProduct'
      responses:
        '201':
          description: Created
  /functions/v1/admin-subscriptions/plans/{id}:
    put:
      tags:
      - AdminSubscriptions
      summary: Update subscription plan product
      operationId: adminUpdatePlan
      security:
      - AdminBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Updated
    delete:
      tags:
      - AdminSubscriptions
      summary: Delete subscription plan product
      operationId: adminDeletePlan
      security:
      - AdminBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Deleted
  /functions/v1/admin-subscriptions/records:
    get:
      tags:
      - AdminSubscriptions
      summary: List subscription records
      operationId: adminListSubscriptionRecords
      security:
      - AdminBearer: []
      responses:
        '200':
          description: OK
  /functions/v1/admin-subscriptions/revenue:
    get:
      tags:
      - AdminSubscriptions
      summary: Subscription revenue series
      operationId: adminSubscriptionRevenue
      security:
      - AdminBearer: []
      responses:
        '200':
          description: OK
  /functions/v1/admin-recipe-import/jobs:
    get:
      tags:
      - AdminRecipeImport
      summary: List recipe import jobs
      operationId: adminListRecipeImportJobs
      security:
      - AdminBearer: []
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - pending
          - running
          - imported
          - needs_review
          - failed
          - rejected
          - duplicate
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/RecipeImportJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - AdminRecipeImport
      summary: Create single import job and run pipeline
      description: 'Shared Backend AI Recipe Import pipeline (Issue #55).

        Exact active source URL returns 409 DUPLICATE.

        Uses AIRouter route_key (`recipe_import_text` / `recipe_import_vision`); no Admin-side model keys.

        '
      operationId: adminCreateRecipeImportJob
      security:
      - AdminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeImportCreateRequest'
      responses:
        '201':
          description: Job created and pipeline executed
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    $ref: '#/components/schemas/RecipeImportJob'
                  result:
                    type: object
                    additionalProperties: true
        '409':
          description: Exact URL duplicate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /functions/v1/admin-recipe-import/jobs/{jobId}:
    get:
      tags:
      - AdminRecipeImport
      summary: Get import job detail
      operationId: adminGetRecipeImportJob
      security:
      - AdminBearer: []
      parameters:
      - $ref: '#/components/parameters/RecipeImportJobId'
      responses:
        '200':
          description: Job + result + artifact metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    $ref: '#/components/schemas/RecipeImportJob'
                  result:
                    oneOf:
                    - $ref: '#/components/schemas/RecipeImportResult'
                    - type: 'null'
                  artifacts:
                    type: array
                    items:
                      $ref: '#/components/schemas/RecipeImportArtifact'
        '404':
          description: Not found
  /functions/v1/admin-recipe-import/jobs/{jobId}/retry:
    post:
      tags:
      - AdminRecipeImport
      summary: Retry job from a pipeline stage
      operationId: adminRetryRecipeImportJob
      security:
      - AdminBearer: []
      parameters:
      - $ref: '#/components/parameters/RecipeImportJobId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fromStage:
                  $ref: '#/components/schemas/RecipeImportStage'
      responses:
        '200':
          description: Retry result
  /functions/v1/admin-recipe-import/jobs/{jobId}/reparse:
    post:
      tags:
      - AdminRecipeImport
      summary: Re-run AI parse from parse stage
      operationId: adminReparseRecipeImportJob
      security:
      - AdminBearer: []
      parameters:
      - $ref: '#/components/parameters/RecipeImportJobId'
      responses:
        '200':
          description: Reparse result
  /functions/v1/admin-recipe-import/jobs/{jobId}/approve:
    post:
      tags:
      - AdminRecipeImport
      summary: Approve needs-review job and import
      operationId: adminApproveRecipeImportJob
      security:
      - AdminBearer: []
      parameters:
      - $ref: '#/components/parameters/RecipeImportJobId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                destinationUserId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Approve / import result
  /functions/v1/admin-recipe-import/jobs/{jobId}/reject:
    post:
      tags:
      - AdminRecipeImport
      summary: Reject import job
      operationId: adminRejectRecipeImportJob
      security:
      - AdminBearer: []
      parameters:
      - $ref: '#/components/parameters/RecipeImportJobId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Rejected job
  /functions/v1/admin-recipe-import/batches:
    post:
      tags:
      - AdminRecipeImport
      summary: Create batch import (jobs pending; queue worker
      operationId: adminCreateRecipeImportBatch
      security:
      - AdminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - urls
              properties:
                urls:
                  type: array
                  items:
                    type: string
                    format: uri
                destinationUserId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Batch created with pending jobs
  /functions/v1/admin-recipe-import/batches/{batchId}:
    get:
      tags:
      - AdminRecipeImport
      summary: Get batch summary + jobs
      operationId: adminGetRecipeImportBatch
      security:
      - AdminBearer: []
      parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Batch summary
  /functions/v1/storage-cleanup-import-artifacts:
    post:
      tags:
      - Storage
      - Operations
      summary: Cleanup expired recipe-import-artifacts
      description: 'Operational job type `storage_cleanup_import_artifacts`.

        Deletes Storage objects whose `recipe_import_artifact_objects.expires_at`

        has passed and marks rows deleted. Server/cron only — auth via

        `Authorization: Bearer <STORAGE_CLEANUP_SECRET>`.

        Never uses permanent signed URLs; never returns service_role secrets.

        '
      operationId: storageCleanupImportArtifacts
      security:
      - CleanupBearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  default: 200
      responses:
        '200':
          description: Cleanup run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageCleanupResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Misconfigured (missing STORAGE_CLEANUP_SECRET)
components:
