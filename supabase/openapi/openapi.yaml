openapi: 3.1.0
info:
  title: CookApp Cloud Backend API
  version: 1.0.0
  description: |
    Supabase-backed API for CookApp. Primary data access is PostgREST (`/rest/v1`)
    with Row Level Security. Privileged operations use Edge Functions (`/functions/v1`).

    Authentication: Supabase Auth session JWT (`Authorization: Bearer <access_token>`).
    Third-party OAuth tokens are never stored server-side.

    Project: `semsjyrqjnumpvanibip` · Base: `https://semsjyrqjnumpvanibip.supabase.co`
  contact:
    name: CookApp
servers:
- url: https://semsjyrqjnumpvanibip.supabase.co
  description: Supabase Cloud
tags:
- name: Auth
- name: User
- name: Recipe
- name: Collection
- name: Ingredient
- name: Grocery
- name: MealPlan
- name: Pantry
- name: Category
- name: Storage
- name: Subscription
- name: System
- name: AdminAuth
- name: AdminUsers
- name: AdminDashboard
- name: AdminSubscriptions
- name: AdminRecipeImport
- name: Operations
- name: AdminAI
- name: AdminStoreSync
- name: AdminIntegrations
- name: AdminOperations
- name: AdminAnalytics
- name: AdminCatalog
paths:
  /auth/v1/token:
    post:
      tags:
      - Auth
      summary: Session token exchange / refresh
      description: |
        Supabase Auth endpoint. Clients use the Supabase SDK for Apple ID token,
        Google OAuth, logout, and refresh. Documented for completeness.
      security: []
      responses:
        '200':
          description: Session issued
  /functions/v1/admin-ai/health:
    get:
      tags:
      - AdminAI
      summary: AI provider health
      security:
      - AdminBearer: []
      operationId: adminAiHealth
      responses:
        '200':
          description: Health snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/AiProviderHealth'
  /functions/v1/admin-ai/models:
    get:
      tags:
      - AdminAI
      summary: List AI models
      security:
      - AdminBearer: []
      operationId: adminAiListModels
      parameters:
      - name: providerId
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Model list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AiModel'
    post:
      tags:
      - AdminAI
      summary: Register AI model (Owner)
      security:
      - AdminBearer: []
      operationId: adminAiCreateModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiModelCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiModel'
  /functions/v1/admin-ai/models/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      tags:
      - AdminAI
      summary: Update AI model (Owner)
      security:
      - AdminBearer: []
      operationId: adminAiUpdateModel
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiModelUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiModel'
    delete:
      tags:
      - AdminAI
      summary: Delete AI model (Owner)
      security:
      - AdminBearer: []
      operationId: adminAiDeleteModel
      responses:
        '200':
          description: Deleted
  /functions/v1/admin-ai/providers:
    get:
      tags:
      - AdminAI
      summary: List AI providers
      description: |
        Admin bearer required. Returns providers with `secretConfigured` boolean only —
        never plaintext API keys or secret_ref values.
      security:
      - AdminBearer: []
      operationId: adminAiListProviders
      responses:
        '200':
          description: Provider list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AiProvider'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - AdminAI
      summary: Create AI provider (Owner)
      security:
      - AdminBearer: []
      operationId: adminAiCreateProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiProviderCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProvider'
        '403':
          description: Owner role required
  /functions/v1/admin-ai/providers/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - AdminAI
      summary: Get AI provider
      security:
      - AdminBearer: []
      operationId: adminAiGetProvider
      responses:
        '200':
          description: Provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProvider'
        '404':
          description: Not found
    put:
      tags:
      - AdminAI
      summary: Update AI provider (Owner)
      security:
      - AdminBearer: []
      operationId: adminAiUpdateProvider
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiProviderUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProvider'
    delete:
      tags:
      - AdminAI
      summary: Delete AI provider (Owner)
      security:
      - AdminBearer: []
      operationId: adminAiDeleteProvider
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /functions/v1/admin-ai/providers/{id}/secret:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      tags:
      - AdminAI
      summary: Set provider API key (Owner, write-only)
      description: |
        Stores ciphertext in server-side `ai_secrets`. There is no read-full-secret API.
        Response only confirms `secretConfigured: true`.
      security:
      - AdminBearer: []
      operationId: adminAiSetProviderSecret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - apiKey
              properties:
                apiKey:
                  type: string
                  description: Provider API key (never logged or returned)
      responses:
        '200':
          description: Secret stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  secretConfigured:
                    type: boolean
                  provider:
                    $ref: '#/components/schemas/AiProvider'
  /functions/v1/admin-ai/providers/{id}/test:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - AdminAI
      summary: Test provider connection via Backend (Owner)
      description: Minimal low-cost probe. Admin browser never calls the provider directly.
      security:
      - AdminBearer: []
      operationId: adminAiTestProvider
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                upstreamModelId:
                  type: string
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  latencyMs:
                    type: integer
                  model:
                    type: string
  /functions/v1/admin-ai/resolve:
    post:
      tags:
      - AdminAI
      summary: Resolve route model chain (Owner, no provider call)
      security:
      - AdminBearer: []
      operationId: adminAiResolveRoute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - routeKey
              properties:
                routeKey:
                  type: string
      responses:
        '200':
          description: Resolved chain (no secrets)
  /functions/v1/admin-ai/routes:
    get:
      tags:
      - AdminAI
      summary: List logical AI routes
      security:
      - AdminBearer: []
      operationId: adminAiListRoutes
      responses:
        '200':
          description: Routes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AiRoute'
  /functions/v1/admin-ai/routes/{routeKey}:
    parameters:
    - name: routeKey
      in: path
      required: true
      schema:
        type: string
        enum:
        - recipe_import_text
        - recipe_import_vision
        - recipe_quality_check
        - assistant_default
        - assistant_vision
    get:
      tags:
      - AdminAI
      summary: Get AI route
      security:
      - AdminBearer: []
      operationId: adminAiGetRoute
      responses:
        '200':
          description: Route
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiRoute'
    put:
      tags:
      - AdminAI
      summary: Update AI route primary/fallback (Owner)
      description: At most 3 fallback model ids. Business code must use route_key only.
      security:
      - AdminBearer: []
      operationId: adminAiUpdateRoute
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiRouteUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiRoute'
  /functions/v1/admin-ai/usage:
    get:
      tags:
      - AdminAI
      summary: AI usage summary + recent events
      description: Metadata only — full prompts/responses are not stored by default.
      security:
      - AdminBearer: []
      operationId: adminAiUsage
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: routeKey
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Usage summary and events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiUsageResponse'
  /functions/v1/admin-auth/bootstrap:
    post:
      tags:
      - AdminAuth
      summary: Bootstrap Owner credentials
      description: |
        Replaces the default seed account with a strong Owner password.
        Requires current default password when a seed row exists.
        Production requires header `X-CookApp-Bootstrap-Token` matching
        secret `COOKAPP_ADMIN_BOOTSTRAP_TOKEN` (never commit the token).
        Local/dev may omit the token when `COOKAPP_ADMIN_ENV=development`.
      security: []
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XRequestId'
      - name: X-CookApp-Bootstrap-Token
        in: header
        required: false
        schema:
          type: string
        description: Required in production; equals COOKAPP_ADMIN_BOOTSTRAP_TOKEN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - newPassword
              properties:
                username:
                  type: string
                  default: admin
                newPassword:
                  type: string
                  format: password
                  minLength: 12
                currentPassword:
                  type: string
                  format: password
      responses:
        '200':
          description: Owner bootstrapped and session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionPayload'
        '400':
          description: Weak password or invalid bootstrap state
        '401':
          description: Current default password incorrect
        '409':
          description: Bootstrap not available
  /functions/v1/admin-auth/change-password:
    post:
      tags:
      - AdminAuth
      summary: Change admin password
      description: |
        Requires strong password policy (min 12, upper, lower, digit).
        Revokes all sessions for the account and returns a fresh token.
      security:
      - AdminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - currentPassword
              - newPassword
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
                  minLength: 12
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AdminSessionPayload'
                - type: object
                  properties:
                    ok:
                      type: boolean
        '400':
          description: Weak password
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XRequestId'
  /functions/v1/admin-auth/login:
    post:
      tags:
      - AdminAuth
      summary: Admin login
      description: |
        Issues a custom admin bearer session (not end-user JWT).
        Production rejects default `admin`/`admin` credentials (Issue #51).
        Set `COOKAPP_ADMIN_ALLOW_DEFAULT_CREDENTIALS=true` or `COOKAPP_ADMIN_ENV=development`
        only for local/dev.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - password
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionPayload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Default credentials blocked in production
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XRequestId'
  /functions/v1/admin-auth/logout:
    post:
      tags:
      - AdminAuth
      summary: Admin logout
      description: Revokes the current admin bearer session.
      security:
      - AdminBearer: []
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XRequestId'
  /functions/v1/admin-auth/session:
    get:
      tags:
      - AdminAuth
      summary: Current admin session
      security:
      - AdminBearer: []
      responses:
        '200':
          description: Session valid
          content:
            application/json:
              schema:
                type: object
                required:
                - admin
                properties:
                  admin:
                    $ref: '#/components/schemas/AdminIdentity'
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XRequestId'
  /functions/v1/admin-dashboard:
    get:
      tags:
      - AdminDashboard
      summary: Dashboard KPI aggregation (source + freshness; no fake Android zeros)
      operationId: adminDashboard
      security:
      - AdminBearer: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardData'
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XRequestId'
  /functions/v1/admin-analytics:
    get:
      tags:
      - AdminAnalytics
      - AdminDashboard
      summary: Analytics aggregation (downloads, growth, import quality)
      description: Real-table analytics (#60). Google Play future_reserved. Missing Apple data is not filled with 0.
      operationId: adminAnalytics
      security:
      - AdminBearer: []
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XRequestId'
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsAggregation'
  /functions/v1/admin-operations/jobs:
    get:
      tags:
      - AdminOperations
      summary: List unified operational jobs
      operationId: adminListOperationalJobs
      security:
      - AdminBearer: []
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XRequestId'
      - name: jobType
        in: query
        schema:
          type: string
      - name: provider
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: OK
  /functions/v1/admin-operations/jobs/run:
    post:
      tags:
      - AdminOperations
      summary: Manually run an operational job
      operationId: adminRunOperationalJob
      security:
      - AdminBearer: []
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - jobType
              properties:
                jobType:
                  type: string
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Job run result
        '403':
          $ref: '#/components/responses/Forbidden'
  /functions/v1/admin-operations/jobs/{jobId}:
    get:
      tags:
      - AdminOperations
      summary: Inspect an operational job
      operationId: adminGetOperationalJob
      security:
      - AdminBearer: []
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XRequestId'
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalJob'
        '404':
          $ref: '#/components/responses/NotFound'
  /functions/v1/admin-operations/jobs/{jobId}/retry:
    post:
      tags:
      - AdminOperations
      summary: Retry a failed operational job
      operationId: adminRetryOperationalJob
      security:
      - AdminBearer: []
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XRequestId'
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Retry result
        '403':
          $ref: '#/components/responses/Forbidden'
  /functions/v1/admin-operations/integrations:
    get:
      tags:
      - AdminOperations
      summary: Integrations health/status
      description: Not Configured allowed; fake Operational forbidden. Full Settings UI is
      operationId: adminListIntegrations
      security:
      - AdminBearer: []
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: OK
  /functions/v1/admin-operations/integrations/{key}/check:
    post:
      tags:
      - AdminOperations
      summary: Re-probe one integration
      operationId: adminCheckIntegration
      security:
      - AdminBearer: []
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XRequestId'
      - name: key
        in: path
        required: true
        schema:
          type: string
          enum:
          - supabase
          - revenuecat
          - app_store_connect
          - ai_gateway
          - google_play
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationStatus'
  /functions/v1/admin-operations/job-types:
    get:
      tags:
      - AdminOperations
      summary: List registered operational job types
      operationId: adminListJobTypes
      security:
      - AdminBearer: []
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: OK
  /functions/v1/admin-integrations:
    get:
      tags:
      - AdminIntegrations
      summary: List integration connection statuses
      description: |
        Returns connected / not_configured / degraded / future_reserved for
        Supabase, RevenueCat, App Store Connect, AI Gateway, and Google Play.
        Secrets are never returned as plaintext — only `secretConfigured`.
        Google Play is always Future Reserved / Not Connected (Issue #63).
      security:
      - AdminBearer: []
      operationId: adminIntegrationsList
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Integration status list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationsListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /functions/v1/admin-integrations/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IntegrationId'
    get:
      tags:
      - AdminIntegrations
      summary: Get one integration status
      security:
      - AdminBearer: []
      operationId: adminIntegrationsGet
      responses:
        '200':
          description: Integration status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationStatus'
        '404':
          $ref: '#/components/responses/NotFound'
  /functions/v1/admin-integrations/{id}/config:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IntegrationId'
    put:
      tags:
      - AdminIntegrations
      summary: Update non-secret integration config (Owner)
      description: Non-secret fields only (e.g. ASC issuerId / keyId). Never accepts secret values.
      security:
      - AdminBearer: []
      operationId: adminIntegrationsPutConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                issuerId:
                  type: string
                keyId:
                  type: string
      responses:
        '200':
          description: Config saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  integration:
                    $ref: '#/components/schemas/IntegrationStatus'
  /functions/v1/admin-integrations/{id}/secret:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IntegrationId'
    put:
      tags:
      - AdminIntegrations
      summary: Write-only integration secret (Owner)
      description: |
        Stores ciphertext in `integration_secrets`. There is no read-full-secret API.
        Response only confirms `secretConfigured: true`. Currently supported for
        `app_store_connect`. RevenueCat webhook secret remains Edge env-only;
        AI Gateway secrets use `admin-ai`.
      security:
      - AdminBearer: []
      operationId: adminIntegrationsPutSecret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                privateKey:
                  type: string
                  description: ASC .p8 private key (write-only)
                apiKey:
                  type: string
                secret:
                  type: string
                issuerId:
                  type: string
                keyId:
                  type: string
      responses:
        '200':
          description: Secret stored
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - secretConfigured
                - integration
                properties:
                  ok:
                    type: boolean
                  secretConfigured:
                    type: boolean
                  integration:
                    $ref: '#/components/schemas/IntegrationStatus'
  /functions/v1/admin-integrations/{id}/test:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IntegrationId'
    post:
      tags:
      - AdminIntegrations
      summary: Test integration connection
      description: |
        Backend-initiated probe. Admin browser never calls third-party providers
        directly. Google Play test is rejected (Future Reserved).
      security:
      - AdminBearer: []
      operationId: adminIntegrationsTest
      responses:
        '200':
