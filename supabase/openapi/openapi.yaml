        type: string
        format: uuid
    put:
      tags:
      - AdminAI
      summary: Set provider API key (Owner, write-only)
      description: 'Stores ciphertext in server-side `ai_secrets`. There is no read-full-secret API.

        Response only confirms `secretConfigured: true`.

