  /functions/v1/admin-recipe-import/batches:
    post:
      tags:
      - AdminRecipeImport
      summary: Create batch import and enqueue jobs (async)
      description: |
        Returns immediately. Jobs are processed by recipe-import-worker
        via Supabase Queues / pgmq (Issue #56). Single-job failure does not block the batch.
      operationId: adminCreateRecipeImportBatch
      security:
      - AdminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - urls
              properties:
                urls:
                  type: array
                  items:
                    type: string
                    format: uri
                destinationUserId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Batch created; jobs enqueued pending
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch:
                    $ref: '#/components/schemas/RecipeImportBatch'
                  jobIds:
                    type: array
                    items:
                      type: string
                      format: uuid
                  skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                        reason:
                          type: string
                  queuedCount:
                    type: integer
                  queueMsgIds:
                    type: array
                    items:
                      type: integer
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XRequestId'
  /functions/v1/admin-recipe-import/batches/{batchId}:
    get:
      tags:
      - AdminRecipeImport
      summary: Get batch summary + jobs
      operationId: adminGetRecipeImportBatch
      security:
      - AdminBearer: []
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XRequestId'
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Batch summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch:
                    $ref: '#/components/schemas/RecipeImportBatch'
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/RecipeImportJob'
  /functions/v1/admin-recipe-import/jobs:
    get:
      tags:
      - AdminRecipeImport
      summary: List recipe import jobs
      operationId: adminListRecipeImportJobs
      security:
      - AdminBearer: []
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XRequestId'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - pending
          - running
          - imported
          - needs_review
          - failed
          - rejected
          - duplicate
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/RecipeImportJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - AdminRecipeImport
      summary: Create single import job and enqueue for async worker
      description: |
        Shared Backend AI Recipe Import pipeline (Issue #55).
        Exact active source URL returns 409 DUPLICATE.
        Uses AIRouter route_key (`recipe_import_text` / `recipe_import_vision`); no Admin-side model keys.
        Job is enqueued on Supabase Queues (pgmq) — Issue #56. Worker runs pipeline asynchronously.
      operationId: adminCreateRecipeImportJob
      security:
      - AdminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeImportCreateRequest'
      responses:
        '201':
          description: Job created and enqueued (pending)
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    $ref: '#/components/schemas/RecipeImportJob'
                  queued:
                    type: boolean
                  queueMsgId:
                    type:
                    - integer
                    - 'null'
        '409':
          description: Exact URL duplicate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XRequestId'
  /functions/v1/admin-recipe-import/jobs/{jobId}:
    get:
      tags:
      - AdminRecipeImport
      summary: Get import job detail
      operationId: adminGetRecipeImportJob
      security:
      - AdminBearer: []
      parameters:
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/RecipeImportJobId'
      responses:
        '200':
          description: Job + result + artifact metadata
          content:
